<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KODI ツール メニュー</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d1a22; /* 背景色をツール側に合わせてダークに変更 */
            color: #cfd9e3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .menu-container {
            text-align: center;
            background: #122029; /* コンテナもツール側のカード色に統一 */
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #2f6f73;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #cfd9e3;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .btn {
            display: block;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease, transform 0.2s ease;
            font-weight: bold;
        }
        /* スマートプレイリストボタン（ご指定の水色） */
        .btn-playlist {
            background-color: #2f9aa0;
        }
        .btn-playlist:hover {
            background-color: #3fbac2; /* ホバー時に画像の鮮やかな水色に */
        }
        /* TBNツールボタン（画像変換ツールのアクセントカラー） */
        .btn-tbn {
            background-color: #128cb5;
        }
        .btn-tbn:hover {
            background-color: #17b2e5;
        }
    </style>
</head>
<body>

<div class="menu-container">
    <h1>KODI ツール選択メニュー</h1>
    <div class="menu-buttons">
        <a href="https://minosima.github.io/KODI_Tools/PlayList_Tool.html" class="btn btn-playlist">KODI SmartplayListTool</a>
        <a href="https://minosima.github.io/KODI_Tools/KODI_TBN_Tool" class="btn btn-tbn">KODI TBN Tool</a>
    </div>
</div>

</body>
</html>
