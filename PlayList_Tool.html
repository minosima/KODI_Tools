<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>KODI Music Playlist Generator</title>
    <style>
        body { background-color: #0d1a22; color: #cfd9e3; font-family: sans-serif; padding: 20px; line-height: 1.4; max-width: 900px; margin: 0 auto; }
        h2, h3 { color: #3fbac2; margin-top: 0; margin-bottom: 10px; }
        .row { display: flex; gap: 12px; margin-bottom: 8px; }
        .card { background-color: #122029; border: 1px solid #2f6f73; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
        input, textarea, select { background-color: #16262f; color: #cfd9e3; border: 1px solid #2f6f73; border-radius: 6px; font-size: 14px; padding: 8px 10px; box-sizing: border-box; }
        button { background-color: #2f9aa0; color: #ffffff; border: none; padding: 10px 18px; cursor: pointer; border-radius: 6px; font-size: 14px; transition: 0.2s; }
        button:hover { background-color: #3fbac2; }
        button.secondary { background-color: #445663; }
        button.danger { background-color: #dc3545; }
        button.generate { width: 100%; font-size: 16px; font-weight: bold; background-color: #3fbac2; color: #0d1a22; margin-top: 10px; }
        .rule-row { background: #1a2c38; padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #3fbac2; }
        .artist-helper, .genre-helper { background: #122029; padding: 12px; border: 1px dashed #3fbac2; border-radius: 6px; margin-top: 10px; display: none; }
        .genre-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .genre-tag { font-size: 11px; background: #1a2c38; border: 1px solid #3fbac2; color: #3fbac2; padding: 3px 8px; border-radius: 4px; cursor: pointer; }
        .genre-tag.active { background: #3fbac2; color: #0d1a22; font-weight: bold; }
        .hint { font-size: 12px; color: #8fb3b8; margin-bottom: 5px; }
        #imagePreview { max-width: 100px; max-height: 100px; border: 1px solid #2f6f73; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<a href="index.html" style="display: inline-block; padding: 6px 12px; background-color: #16262f; color: #cfd9e3; text-decoration: none; border: 1px solid #2f6f73; border-radius: 6px; font-size: 13px; margin-bottom: 15px;">← メニューに戻る</a>

<h2>KODI Music Playlist Generator</h2>

<div class="card">
    <button class="secondary" onclick="clearAllFields()">入力をクリア</button>
    <button class="secondary" id="restoreBtn" onclick="restoreState()" disabled>情報を復元する（50ステップまで）</button>
</div>

<div class="card">
    <h3>1. 音楽設定</h3>
    <div class="row">
        <div style="flex:2;"><label class="hint">プレイリスト名</label><input id="playlistName" style="width:100%;" placeholder="例：Random 10 Songs" onchange="saveState()"></div>
        <div style="flex:1;"><label class="hint">対象</label><select id="mediaType" style="width:100%;" onchange="saveState()"><option value="albums">アルバム (Albums)</option><option value="songs">曲 (Songs)</option></select></div>
    </div>
</div>

<div class="card">
    <h3>1.5 画像変換設定</h3>
    <input type="file" id="imageInput" accept="image/*" style="margin-bottom: 10px;" onchange="previewImage(this)">
    <br><img id="imagePreview" src="#" alt="Preview">
    <div class="row" style="margin-top: 10px;">
        <div><label class="hint">幅 px</label><input type="number" id="imgWidth" value="512" onchange="saveState()"></div>
        <div><label class="hint">高さ px</label><input type="number" id="imgHeight" value="512" onchange="saveState()"></div>
    </div>
    <div class="row">
        <div style="flex:1;"><label class="hint">拡大モード</label>
            <select id="scaleMode" style="width:100%;" onchange="saveState()"><option value="none">拡大禁止（元解像度を維持）</option><option value="fill">全体を埋める</option></select>
        </div>
        <div style="display:flex; align-items:center; padding-top:15px;"><label><input type="checkbox" id="keepAspect" checked onchange="saveState()"> 縦横比を維持</label></div>
    </div>
    <label class="hint">画像形式</label>
    <select id="imgFormat" style="margin-bottom:10px;" onchange="saveState()"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option></select>
    <label class="hint">画質 (JPEG用)</label>
    <input type="range" id="imgQuality" min="0" max="100" value="95" style="width:100%;" onchange="saveState()">
</div>

<div class="card">
    <h3>2. 絞り込みルール</h3>
    <div id="rulesContainer"></div>
    <button type="button" class="secondary" onclick="addRule()">＋ ルールを追加</button>
    <div style="margin-top:15px;"><label class="hint">条件の判定</label><select id="matchType" onchange="saveState()"><option value="all">すべての条件に一致 (AND)</option><option value="one">いずれかの条件に一致 (OR)</option></select></div>
</div>

<div class="card">
    <h3>3. 表示順序と制限</h3>
    <div class="row">
        <div style="flex:2;">
            <label class="hint">並び順</label>
            <select id="orderField" style="width:100%;" onchange="saveState()">
                <option value="year">年</option>
                <option value="random">ランダム (Random)</option>
                <option value="artist">アーティスト</option>
                <option value="title">タイトル</option>
                <option value="rating">評価</option>
                <option value="playcount">再生回数</option>
            </select>
        </div>
        <div style="flex:1;">
            <label class="hint">順序</label>
            <select id="orderDir" style="width:100%;" onchange="saveState()">
                <option value="descending">降順</option>
                <option value="ascending">昇順</option>
            </select>
        </div>
        <div style="flex:1;">
            <label class="hint">項目数(0で無制限)</label>
            <input type="number" id="limitCount" value="0" min="0" style="width:100%;" onchange="saveState()">
        </div>
    </div>
</div>

<button class="generate" onclick="generateXSP()">XMLファイルを生成・ダウンロード</button>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    let currentGenres = ["J-Pop", "Rock", "Jazz", "Classical", "Electronic", "Anime"];
    let historyStack = [];

    window.onload = function() {
        addRule();
    };

    function saveState() {
        const rules = Array.from(document.querySelectorAll('.rule-row')).map(row => ({
            field: row.querySelector('.field').value,
            op: row.querySelector('.operator').value,
            jpS: row.querySelector('.jpS')?.value,
            jpG: row.querySelector('.jpG')?.value,
            kanaS: row.querySelector('.kanaS')?.value,
            kanaG: row.querySelector('.kanaG')?.value,
            rawList: row.querySelector('.rawList')?.value,
            ruleValue: row.querySelector('.ruleValue')?.value
        }));

        const state = {
            playlistName: document.getElementById('playlistName').value,
            mediaType: document.getElementById('mediaType').value,
            imgWidth: document.getElementById('imgWidth').value,
            imgHeight: document.getElementById('imgHeight').value,
            scaleMode: document.getElementById('scaleMode').value,
            keepAspect: document.getElementById('keepAspect').checked,
            imgFormat: document.getElementById('imgFormat').value,
            imgQuality: document.getElementById('imgQuality').value,
            matchType: document.getElementById('matchType').value,
            orderField: document.getElementById('orderField').value,
            orderDir: document.getElementById('orderDir').value,
            limitCount: document.getElementById('limitCount').value,
            rules: rules
        };

        historyStack.push(JSON.stringify(state));
        if (historyStack.length > 50) historyStack.shift();
        document.getElementById('restoreBtn').disabled = false;
    }

    function restoreState() {
        if (historyStack.length === 0) return;
        historyStack.pop(); // 現在の状態を捨てる
        if (historyStack.length === 0) return;
        
        const state = JSON.parse(historyStack.pop());
        document.getElementById('playlistName').value = state.playlistName;
        document.getElementById('mediaType').value = state.mediaType;
        document.getElementById('imgWidth').value = state.imgWidth;
        document.getElementById('imgHeight').value = state.imgHeight;
        document.getElementById('scaleMode').value = state.scaleMode;
        document.getElementById('keepAspect').checked = state.keepAspect;
        document.getElementById('imgFormat').value = state.imgFormat;
        document.getElementById('imgQuality').value = state.imgQuality;
        document.getElementById('matchType').value = state.matchType;
        document.getElementById('orderField').value = state.orderField;
        document.getElementById('orderDir').value = state.orderDir;
        document.getElementById('limitCount').value = state.limitCount;

        const container = document.getElementById('rulesContainer');
        container.innerHTML = "";
        state.rules.forEach(r => {
            addRule();
            const row = container.lastElementChild;
            row.querySelector('.field').value = r.field;
            row.querySelector('.operator').value = r.op;
            if(r.field === 'artist') {
                row.querySelector('.jpS').value = r.jpS; row.querySelector('.jpG').value = r.jpG;
                row.querySelector('.kanaS').value = r.kanaS; row.querySelector('.kanaG').value = r.kanaG;
                row.querySelector('.rawList').value = r.rawList;
            } else {
                row.querySelector('.ruleValue').value = r.ruleValue;
            }
            toggleHelper(row.querySelector('.field'));
        });
        if (historyStack.length === 0) document.getElementById('restoreBtn').disabled = true;
    }

    function previewImage(input) {
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
            reader.readAsDataURL(input.files[0]);
        }
        saveState();
    }

    function addRule() {
        const container = document.getElementById('rulesContainer');
        const row = document.createElement('div');
        row.className = 'rule-row';
        row.innerHTML = `
            <div class="row">
                <select class="field" onchange="toggleHelper(this); saveState()">
                    <option value="artist">アーティスト</option>
                    <option value="genre">ジャンル</option>
                    <option value="title">タイトル</option>
                    <option value="year">年</option>
                    <option value="rating">評価</option>
                    <option value="path">パス</option>
                </select>
                <select class="operator" onchange="saveState()">
                    <option value="contains">を含む</option>
                    <option value="is">と一致する</option>
                    <option value="doesnotcontain">を含まない</option>
                </select>
                <button class="danger" onclick="this.parentElement.parentElement.remove(); saveState()">削除</button>
            </div>
            <div class="artist-helper" style="display:block;">
                <input class="jpS" placeholder="姓" oninput="saveState()" style="width:48%"> <input class="jpG" placeholder="名" oninput="saveState()" style="width:48%">
                <input class="kanaS" placeholder="せい" oninput="saveState()" style="width:48%"> <input class="kanaG" placeholder="めい" oninput="saveState()" style="width:48%">
                <textarea class="rawList" placeholder="直接入力" oninput="saveState()" style="width:100%; height:40px; margin-top:5px;"></textarea>
            </div>
            <div class="normal-input" style="display:none;"><input type="text" class="ruleValue" placeholder="値" oninput="saveState()" style="width:100%;"></div>
        `;
        container.appendChild(row);
        saveState();
    }

    function toggleHelper(select) {
        const row = select.closest('.rule-row');
        row.querySelector('.artist-helper').style.display = select.value === 'artist' ? 'block' : 'none';
        row.querySelector('.normal-input').style.display = (select.value !== 'artist') ? 'block' : 'none';
    }

    function clearAllFields() {
        saveState();
        document.getElementById('playlistName').value = "";
        document.getElementById('rulesContainer').innerHTML = "";
        addRule();
    }

    function esc(s) { return s ? s.replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c])) : ""; }

    function generateXSP() {
        const name = document.getElementById('playlistName').value.trim() || 'Playlist';
        let xml = `<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>\n<smartplaylist type="${document.getElementById('mediaType').value}">\n`;
        xml += `    <name>${esc(name)}</name>\n    <match>${document.getElementById('matchType').value}</match>\n`;
        
        document.querySelectorAll('.rule-row').forEach(row => {
            const field = row.querySelector('.field').value;
            const op = row.querySelector('.operator').value;
            xml += `    <rule field="${field}" operator="${op}">\n`;
            if(field === 'artist') {
                xml += `        <value>${esc(row.querySelector('.jpS').value + row.querySelector('.jpG').value)}</value>\n`;
            } else {
                xml += `        <value>${esc(row.querySelector('.ruleValue').value)}</value>\n`;
            }
            xml += `    </rule>\n`;
        });
        
        xml += `    <order direction="${document.getElementById('orderDir').value}">${document.getElementById('orderField').value}</order>\n</smartplaylist>`;
        const blob = new Blob([xml], { type: 'application/xml' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${name}.xsp`; a.click();
        
        // 画像処理ロジックは以前のものを維持
        const fileInput = document.getElementById('imageInput');
        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = parseInt(document.getElementById('imgWidth').value);
                    canvas.height = parseInt(document.getElementById('imgHeight').value);
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(b => {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(b);
                        a.download = `${name}.${document.getElementById('imgFormat').value === 'image/jpeg' ? 'jpg' : 'png'}`;
                        a.click();
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(fileInput.files[0]);
        }
    }
</script>
</body>
</html>
